<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1016">
<title>Dual N-Back Pro V6 (Synced)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #0f1016;
  --text-main: #f0f0f0;
  --text-muted: #8b8d98;
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.5);
  --secondary: #ec4899;
  --success: #10b981;
  --danger: #ef4444;
  --surface: rgba(255, 255, 255, 0.03);
  --surface-border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background-color: var(--bg-color);
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.12), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.12), transparent 25%);
  color: var(--text-main);
  font-family: 'Outfit', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
}

/* Glassmorphism Panel Base */
.glass-panel {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--surface-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 14, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  place-content: center;
  align-items: center;
  gap: 20px;
  z-index: 100;
  transition: opacity 0.3s ease;
}

.title {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(135deg, #a8b1ff, #ffb1df);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  text-shadow: 0 4px 20px rgba(168, 177, 255, 0.2);
  text-align: center;
}

#final-score {
  font-size: 1.5rem;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: none;
  text-align: center;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#final-score span.ratio {
  font-size: 4rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
  display: block;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.settings-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  font-size: 1.2rem;
  font-weight: 600;
  width: 260px;
}

input[type=number] {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--surface-border);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 1.2rem;
  padding: 8px;
  width: 70px;
  text-align: center;
  border-radius: 8px;
  transition: all 0.2s;
}

input[type=number]:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

#leaderboard {
  padding: 20px;
  width: 300px;
  margin-top: 10px;
}

.lb-title {
  text-align: center;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 15px;
  font-size: 1.1rem;
  letter-spacing: 1px;
}

.lb-row {
  display: flex;
  justify-content: space-between;
  font-size: 1rem;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.lb-row:last-child {
  border-bottom: none;
}

#start {
  padding: 16px 60px;
  font-size: 1.4rem;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  border: none;
  border-radius: 50px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
  transition: all 0.2s ease;
  font-family: inherit;
}

#start:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
}

#start:active {
  transform: translateY(1px);
}

#stats {
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0, 0, 0, 0.2);
  border-bottom: 1px solid var(--surface-border);
  font-size: 1.1rem;
  backdrop-filter: blur(10px);
}

.stat-group {
  display: flex;
  gap: 20px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.stat-value {
  font-size: 1.4rem;
  font-weight: 800;
}

.score-display {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary);
  text-shadow: 0 0 15px var(--primary-glow);
}

#game {
  flex: 1;
  display: flex;
  place-content: center;
  place-items: center;
  position: relative;
  perspective: 1000px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: min(85vw, 45vh);
  aspect-ratio: 1;
  padding: 15px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.02);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0,0,0,0.3);
  border: 1px solid var(--surface-border);
}

.cell {
  background: rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: inset 0 4px 6px rgba(255, 255, 255, 0.02);
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

.active {
  background: var(--primary) !important;
  border-color: var(--primary);
  box-shadow: 0 0 30px var(--primary-glow), inset 0 0 10px rgba(255, 255, 255, 0.5);
  transform: scale(0.95);
}

#controls {
  padding: 25px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  border: 1px solid var(--surface-border);
  border-radius: 16px;
  font-size: 1.3rem;
  font-weight: 600;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.btn-key {
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.1);
  padding: 3px 10px;
  border-radius: 6px;
  color: var(--text-muted);
}

.btn:not(.disabled):hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(2px) scale(0.98);
}

.btn.disabled {
  opacity: 0.4;
  pointer-events: none;
  background: rgba(0, 0, 0, 0.2);
}

.btn-success {
  background-color: var(--success) !important;
  color: #fff !important;
  border-color: var(--success) !important;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
  transform: scale(1.05);
}

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease-out;
  z-index: 50;
}

.bad {
  background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, rgba(239, 68, 68, 0) 70%);
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}

@media (max-width: 600px) {
  .title { font-size: 2.2rem; }
  .btn { font-size: 1.1rem; padding: 15px; }
  #controls { padding: 15px; gap: 10px; }
  #stats { padding: 10px 15px; }
}
</style>
</head>
<body>
<div id="flash"></div>

<div id="overlay">
  <div class="title">Dual N-Back Pro</div>
  
  <div id="final-score">
    <span class="ratio"><span id="end-hits">0</span> / <span id="end-total">0</span></span>
    <small>correct matches</small>
  </div>

  <div class="glass-panel settings-container">
    <div class="setting-row">
      <label>N-Level</label>
      <input type="number" id="n-input" value="2" min="1" max="9" onchange="renderLB()">
    </div>
    <div class="setting-row">
      <label>Time (s)</label>
      <input type="number" id="time-input" value="30" min="10" max="300">
    </div>
  </div>

  <div id="leaderboard" class="glass-panel">
    <div class="lb-title">TOP SCORES (N-<span id="lb-n">2</span>)</div>
    <div id="lb-list"></div>
  </div>

  <button id="start">START GAME</button>
</div>

<div id="stats">
  <div class="stat-group">
    <div class="stat-item">
      <span class="stat-label">Level</span>
      <span class="stat-value" id="n-display">2</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="time-display">30</span>
    </div>
  </div>
  
  <div class="score-display">
    <span id="hits-display">0</span> <span style="color:var(--text-muted);font-size:1.2rem">/</span> <span id="total-display" style="font-size:1.2rem;color:var(--text-main)">0</span>
  </div>
  
  <div class="stat-group">
    <div class="stat-item">
      <span class="stat-label">False Alarms</span>
      <span class="stat-value" style="color:var(--danger)" id="fa-display">0</span>
    </div>
  </div>
</div>

<div id="game"><div id="grid"></div></div>

<div id="controls">
  <button class="btn disabled" id="btn-a">
    Audio Match
    <span class="btn-key">Key: A</span>
  </button>
  <button class="btn disabled" id="btn-p">
    Position Match
    <span class="btn-key">Key: L</span>
  </button>
</div>

<script>
const G=document.getElementById('grid'),
      T_DISP=document.getElementById('time-display'),
      N_DISP=document.getElementById('n-display'),
      F=document.getElementById('flash'),
      OVERLAY=document.getElementById('overlay'),
      END_HITS=document.getElementById('end-hits'),
      END_TOTAL=document.getElementById('end-total'),
      FINAL_SCORE_DIV=document.getElementById('final-score'),
      LB_LIST=document.getElementById('lb-list'),
      LB_N=document.getElementById('lb-n'),
      HITS_DISP=document.getElementById('hits-display'),
      TOTAL_DISP=document.getElementById('total-display'),
      FA_DISP=document.getElementById('fa-display'),
      BTNS={a:document.getElementById('btn-a'),p:document.getElementById('btn-p')},
      LETTERS=['A','B','C','H','K','L','M','O','P','T'];

let state={n:2,hist:[],hits:0,totalMatches:0,falseAlarms:0,active:false,input:{a:false,p:false},timer:null,gameTimer:null,timeLeft:30},
    audCache={}, synth=window.speechSynthesis, selectedVoice=null;

for(let i=0;i<9;i++)G.appendChild(document.createElement('div')).className='cell';
const cells=G.children;

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const playTone=(f,t,d,v)=>{
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
};
const sfx={
    pop:()=>playTone(600,'sine',0.1,0.15),
    hit:()=>playTone(880,'sine',0.2,0.2),
    miss:()=>{playTone(150,'square',0.2,0.1);flash('bad');}
};

function selectVoice(){
    const v=synth.getVoices();
    // Seek out the most pleasant built-in voices across iOS, Android, and Windows
    selectedVoice = v.find(x => x.name.includes('Samantha') || x.name.includes('Daniel')) || // Apple
                    v.find(x => x.name.includes('Google UK English Female') || x.name.includes('Google US English')) || // Android
                    v.find(x => x.name.includes('Aria') || x.name.includes('Natural')) || // Windows
                    v.find(x => x.lang === 'en-US' && x.localService) || 
                    v.find(x => x.lang.startsWith('en')) || 
                    v[0];
}
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=selectVoice;

const loadAud=()=>{
    selectVoice();
    LETTERS.forEach(x=>{
        audCache[x]=new SpeechSynthesisUtterance(x);
        audCache[x].voice=selectedVoice;
        audCache[x].lang='en-US';
        audCache[x].rate=0.85;
        audCache[x].pitch=1.0;
    });
};

const rng=m=>{let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%m};
const flash=c=>{F.className=c;F.style.opacity=1;setTimeout(()=>F.style.opacity=0,200)};

const saveScore=(n,hits,total)=>{
    if(total<=0)return;
    const key=`dnb_scores_n${n}`,scores=JSON.parse(localStorage.getItem(key)||'[]');
    scores.push({h:hits,t:total,d:new Date().toLocaleDateString(undefined,{month:'numeric',day:'numeric'})});
    scores.sort((a,b)=>(b.h/b.t)-(a.h/a.t));
    localStorage.setItem(key,JSON.stringify(scores.slice(0,5)));
};

function renderLB(){
    const n=parseInt(document.getElementById('n-input').value)||2;
    LB_N.textContent=n;
    const scores=JSON.parse(localStorage.getItem(`dnb_scores_n${n}`)||'[]');
    LB_LIST.innerHTML=scores.length
        ?scores.map((x,i)=>`<div class="lb-row"><span>#${i+1} ${x.d}</span><span>${x.h} / ${x.t}</span></div>`).join('')
        :'<div class="lb-row" style="justify-content:center;color:#666">- No Records -</div>';
}

const updateStats=()=>{
    HITS_DISP.textContent=state.hits;
    TOTAL_DISP.textContent=state.totalMatches;
    FA_DISP.textContent=state.falseAlarms;
};

function endGame(){
    state.active=false;
    clearTimeout(state.timer);
    clearInterval(state.gameTimer);
    saveScore(state.n,state.hits,state.totalMatches);
    renderLB();
    END_HITS.textContent=state.hits;
    END_TOTAL.textContent=state.totalMatches;
    FINAL_SCORE_DIV.style.display='block';
    OVERLAY.style.display='flex';
    document.getElementById('start').textContent='PLAY AGAIN';
}

function updateGameTimer(){
    state.timeLeft--;
    T_DISP.textContent=state.timeLeft;
    if(state.timeLeft<=0)endGame();
}

function turn(){
    if(!state.active)return;
    const len=state.hist.length;

    if(len>state.n){
        const prev=state.hist[len-1-state.n],curr=state.hist[len-1];
        if(!state.input.a&&prev.l===curr.l) sfx.miss();
        if(!state.input.p&&prev.p===curr.p) sfx.miss();
    }
    updateStats();
    state.input={a:false,p:false};

    const canMatch=len>=state.n;
    BTNS.a.className=canMatch?'btn':'btn disabled';
    BTNS.p.className=canMatch?'btn':'btn disabled';

    const nPrev=canMatch?state.hist[len-state.n]:null;
    const p=(nPrev&&Math.random()<0.3)?nPrev.p:rng(9);
    const l=(nPrev&&Math.random()<0.3)?nPrev.l:LETTERS[rng(10)];

    state.hist.push({p,l});

    if(canMatch){
        const ref=state.hist[len-state.n];
        if(p===ref.p) state.totalMatches++;
        if(l===ref.l) state.totalMatches++;
    }

    synth.cancel();
    sfx.pop();
    if(audCache[l])synth.speak(audCache[l]);
    else{let u=new SpeechSynthesisUtterance(l);u.voice=selectedVoice;u.rate=0.95;u.pitch=1.0;synth.speak(u);}

    setTimeout(()=>{
        if(!state.active)return;
        cells[p].classList.add('active');
        setTimeout(()=>cells[p].classList.remove('active'),800);
    },100);

    state.timer=setTimeout(turn,3000);
}

function check(type){
    if(!state.active||state.hist.length<=state.n||state.input[type])return;
    state.input[type]=true;
    const btn=BTNS[type];
    const idx=state.hist.length-1;
    const match=type==='a'?state.hist[idx].l===state.hist[idx-state.n].l
                          :state.hist[idx].p===state.hist[idx-state.n].p;
    if(match){
        state.hits++;
        sfx.hit();
        btn.classList.add('btn-success');
        setTimeout(()=>btn.classList.remove('btn-success'),300);
    }else{
        state.falseAlarms++;
        sfx.miss();
    }
    updateStats();
}

function startGame(){
    state.n=parseInt(document.getElementById('n-input').value)||2;
    state.timeLeft=parseInt(document.getElementById('time-input').value)||30;
    N_DISP.textContent=state.n;
    T_DISP.textContent=state.timeLeft;
    FINAL_SCORE_DIV.style.display='none';
    OVERLAY.style.display='none';
    BTNS.a.className='btn disabled';
    BTNS.p.className='btn disabled';
    if(synth.speaking)synth.cancel();
    loadAud();
    
    let wakeUp = new SpeechSynthesisUtterance('');
    wakeUp.volume = 0;
    synth.speak(wakeUp);

    state.active=true;
    state.hist=[];
    state.hits=0;
    state.totalMatches=0;
    state.falseAlarms=0;
    state.input={a:false,p:false};
    updateStats();
    state.gameTimer=setInterval(updateGameTimer,1000);
    turn();
}

const bind=(id,fn)=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('pointerdown',e=>{e.preventDefault();fn();});
};
bind('start',startGame);
bind('btn-a',()=>check('a'));
bind('btn-p',()=>check('p'));

window.addEventListener('keydown',e=>{
    if(e.repeat)return;
    if(e.key.toLowerCase()==='a')check('a');
    if(e.key.toLowerCase()==='l')check('p');
});

renderLB();
selectVoice();
</script>
</body>
</html>
